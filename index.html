<script>
/* =========================================================
   GEN Z TUTORS FULL WEBSITE SYSTEM
========================================================= */

/* =========================
   STORAGE
========================= */
const USERS_KEY = "genz_users";
const CURRENT_USER_KEY = "genz_current_user";
const BOOKINGS_KEY = "genz_bookings";

/* =========================
   DEFAULT ADMIN
========================= */
if (!localStorage.getItem(USERS_KEY)) {
    const defaultUsers = [
        {
            name: "Admin",
            email: "admin@genztutors.com",
            password: "admin123",
            role: "admin"
        }
    ];

    localStorage.setItem(USERS_KEY, JSON.stringify(defaultUsers));
}

/* =========================
   AUTH MODAL
========================= */
const authModal = document.getElementById('authModal');
const loginBtn = document.getElementById('loginBtn');
const signupBtn = document.getElementById('signupBtn');
const closeModal = document.getElementById('closeModal');

loginBtn.addEventListener('click', () => {
    authModal.classList.add('active');
});

signupBtn.addEventListener('click', () => {
    authModal.classList.add('active');
});

closeModal.addEventListener('click', () => {
    authModal.classList.remove('active');
});

window.addEventListener('click', (e) => {
    if (e.target === authModal) {
        authModal.classList.remove('active');
    }
});

/* =========================
   AUTH FORM CREATION
========================= */

const authForm = document.querySelector("#authModal form");

authForm.innerHTML = `
<div>
    <label class="block mb-2 text-sm text-slate-300">Full Name</label>
    <input id="authName"
           type="text"
           placeholder="Enter full name"
           class="w-full bg-[#09111d] border border-white/10 rounded-xl px-5 py-4 text-white">
</div>

<div>
    <label class="block mb-2 text-sm text-slate-300">Email</label>
    <input id="authEmail"
           type="email"
           placeholder="Enter email"
           class="w-full bg-[#09111d] border border-white/10 rounded-xl px-5 py-4 text-white">
</div>

<div>
    <label class="block mb-2 text-sm text-slate-300">Password</label>
    <input id="authPassword"
           type="password"
           placeholder="Enter password"
           class="w-full bg-[#09111d] border border-white/10 rounded-xl px-5 py-4 text-white">
</div>

<div>
    <label class="block mb-2 text-sm text-slate-300">Select Role</label>
    <select id="authRole"
            class="w-full bg-[#09111d] border border-white/10 rounded-xl px-5 py-4 text-white">
        <option value="student">Student</option>
        <option value="tutor">Tutor</option>
    </select>
</div>

<div class="grid grid-cols-2 gap-4">
    <button type="button"
            id="realLoginBtn"
            class="bg-sky-500 hover:bg-sky-600 transition py-4 rounded-xl font-bold">
        Login
    </button>

    <button type="button"
            id="realSignupBtn"
            class="bg-orange-500 hover:bg-orange-600 transition py-4 rounded-xl font-bold">
        Sign Up
    </button>
</div>
`;

/* =========================
   SIGNUP SYSTEM
========================= */

document.getElementById("realSignupBtn").addEventListener("click", () => {

    const name = document.getElementById("authName").value.trim();
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value.trim();
    const role = document.getElementById("authRole").value;

    if (!name || !email || !password) {
        alert("Please complete all fields.");
        return;
    }

    let users = JSON.parse(localStorage.getItem(USERS_KEY));

    const exists = users.find(user => user.email === email);

    if (exists) {
        alert("Account already exists.");
        return;
    }

    const newUser = {
        name,
        email,
        password,
        role
    };

    users.push(newUser);

    localStorage.setItem(USERS_KEY, JSON.stringify(users));

    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(newUser));

    alert("Account created successfully!");

    authModal.classList.remove("active");

    loadDashboard(newUser);
});

/* =========================
   LOGIN SYSTEM
========================= */

document.getElementById("realLoginBtn").addEventListener("click", () => {

    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value.trim();

    let users = JSON.parse(localStorage.getItem(USERS_KEY));

    const user = users.find(
        user => user.email === email && user.password === password
    );

    if (!user) {
        alert("Invalid login details.");
        return;
    }

    localStorage.setItem(CURRENT_USER_KEY, JSON.stringify(user));

    alert("Login successful!");

    authModal.classList.remove("active");

    loadDashboard(user);
});

/* =========================
   GOOGLE LOGIN
========================= */

setTimeout(() => {

    const googleBtn = document.querySelector(
        '#authModal button:last-of-type'
    );

    if (googleBtn) {

        googleBtn.addEventListener("click", () => {

            const googleUser = {
                name: "Google Student",
                email: "googleuser@gmail.com",
                role: "student"
            };

            localStorage.setItem(
                CURRENT_USER_KEY,
                JSON.stringify(googleUser)
            );

            alert("Signed in with Google!");

            authModal.classList.remove("active");

            loadDashboard(googleUser);
        });
    }

}, 100);
   
/* =========================
   DASHBOARDS
========================= */

function loadDashboard(user) {

    removeExistingDashboard();

    const dashboard = document.createElement("section");

    dashboard.id = "dynamicDashboard";

    dashboard.className =
        "fixed inset-0 bg-[#08111f] z-[9999] overflow-y-auto p-8";

    let content = "";

    if (user.role === "student") {

        content = `
        <div class="max-w-6xl mx-auto">

            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-5xl font-extrabold">
                        Student Portal
                    </h1>
                    <p class="text-slate-400 mt-2">
                        Welcome back ${user.name}
                    </p>
                </div>

                <button onclick="logoutUser()"
                        class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-xl font-bold">
                    Logout
                </button>
            </div>

            <div class="grid md:grid-cols-3 gap-8">

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Upcoming Lessons
                    </h3>

                    <p class="text-slate-300">
                        No upcoming lessons yet.
                    </p>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Assignments
                    </h3>

                    <p class="text-slate-300">
                        0 pending assignments.
                    </p>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Progress
                    </h3>

                    <div class="w-full bg-white/10 rounded-full h-4 mt-4">
                        <div class="bg-orange-500 h-4 rounded-full w-[72%]"></div>
                    </div>

                    <p class="mt-4 text-orange-400 font-bold">
                        72% Academic Progress
                    </p>
                </div>

            </div>

        </div>
        `;
    }

    else if (user.role === "tutor") {

        content = `
        <div class="max-w-6xl mx-auto">

            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-5xl font-extrabold">
                        Tutor Portal
                    </h1>

                    <p class="text-slate-400 mt-2">
                        Tutor Dashboard: ${user.name}
                    </p>
                </div>

                <button onclick="logoutUser()"
                        class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-xl font-bold">
                    Logout
                </button>
            </div>

            <div class="grid md:grid-cols-2 gap-8">

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Assigned Students
                    </h3>

                    <ul class="space-y-3 text-slate-300">
                        <li>• Student 1</li>
                        <li>• Student 2</li>
                        <li>• Student 3</li>
                    </ul>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Tutor Analytics
                    </h3>

                    <p class="text-slate-300">
                        Weekly lesson activity: 12 Sessions
                    </p>
                </div>

            </div>

        </div>
        `;
    }

    else if (user.role === "admin") {

        let bookings =
            JSON.parse(localStorage.getItem(BOOKINGS_KEY)) || [];

        let bookingHTML = bookings.length
            ? bookings.map(booking => `
                <div class="border border-white/10 rounded-xl p-4">
                    <h4 class="font-bold">${booking.name}</h4>
                    <p>${booking.tutor}</p>
                    <p>${booking.date}</p>
                </div>
            `).join("")
            : "<p>No bookings yet.</p>";

        content = `
        <div class="max-w-7xl mx-auto">

            <div class="flex justify-between items-center mb-10">
                <div>
                    <h1 class="text-5xl font-extrabold">
                        Admin Portal
                    </h1>

                    <p class="text-slate-400 mt-2">
                        Website management dashboard
                    </p>
                </div>

                <button onclick="logoutUser()"
                        class="bg-red-500 hover:bg-red-600 px-6 py-3 rounded-xl font-bold">
                    Logout
                </button>
            </div>

            <div class="grid md:grid-cols-3 gap-8">

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Total Users
                    </h3>

                    <p class="text-5xl font-extrabold text-orange-400">
                        ${JSON.parse(localStorage.getItem(USERS_KEY)).length}
                    </p>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Tutors
                    </h3>

                    <p class="text-5xl font-extrabold text-sky-400">
                        ${
                            JSON.parse(localStorage.getItem(USERS_KEY))
                            .filter(user => user.role === "tutor").length
                        }
                    </p>
                </div>

                <div class="glass rounded-3xl p-8">
                    <h3 class="text-2xl font-bold mb-4">
                        Students
                    </h3>

                    <p class="text-5xl font-extrabold text-emerald-400">
                        ${
                            JSON.parse(localStorage.getItem(USERS_KEY))
                            .filter(user => user.role === "student").length
                        }
                    </p>
                </div>

            </div>

            <div class="glass rounded-3xl p-8 mt-10">
                <h3 class="text-3xl font-bold mb-6">
                    Session Bookings
                </h3>

                <div class="space-y-4">
                    ${bookingHTML}
                </div>
            </div>

        </div>
        `;
    }

    dashboard.innerHTML = content;

    document.body.appendChild(dashboard);
}

/* =========================
   REMOVE DASHBOARD
========================= */

function removeExistingDashboard() {

    const existing =
        document.getElementById("dynamicDashboard");

    if (existing) {
        existing.remove();
    }
}

/* =========================
   LOGOUT
========================= */

function logoutUser() {

    localStorage.removeItem(CURRENT_USER_KEY);

    removeExistingDashboard();

    alert("Logged out successfully.");
}

/* =========================
   AUTO LOGIN
========================= */

const savedUser =
    JSON.parse(localStorage.getItem(CURRENT_USER_KEY));

if (savedUser) {
    loadDashboard(savedUser);
}

/* =========================
   MOBILE MENU
========================= */

const menuBtn = document.getElementById('menuBtn');
const mobileMenu = document.getElementById('mobileMenu');

if (menuBtn && mobileMenu) {

    const menuIcon = menuBtn.querySelector('i');

    menuBtn.addEventListener('click', () => {

        mobileMenu.classList.toggle('active');

        if (mobileMenu.classList.contains('active')) {

            menuIcon.className = 'fa-solid fa-xmark';

        } else {

            menuIcon.className = 'fa-solid fa-bars';
        }
    });
}

/* =========================
   TESTIMONIALS
========================= */

let currentTestimonial = 0;

const testimonials =
    document.querySelectorAll('.testimonial-slide');

function changeTestimonial(index) {

    testimonials[currentTestimonial]
        .classList.add('hidden');

    testimonials[index]
        .classList.remove('hidden');

    currentTestimonial = index;

    updateDots();
}

function updateDots() {

    document
    .querySelectorAll('[onclick^="changeTestimonial"]')
    .forEach((dot, i) => {

        if (i === currentTestimonial) {

            dot.classList.add('bg-orange-400');
            dot.classList.remove('bg-white/30');

        } else {

            dot.classList.remove('bg-orange-400');
            dot.classList.add('bg-white/30');
        }
    });
}

setInterval(() => {

    currentTestimonial++;

    if (currentTestimonial >= testimonials.length) {
        currentTestimonial = 0;
    }

    changeTestimonial(currentTestimonial);

}, 6000);

/* =========================
   BOOKING SYSTEM
========================= */

const bookingForm =
    document.querySelector('#booking form');

if (bookingForm) {

bookingForm.addEventListener('submit', (e) => {

    e.preventDefault();

    const name =
        bookingForm.querySelector('input[type="text"]').value;

    const tutor =
        bookingForm.querySelector('select').value;

    const date =
        bookingForm.querySelector('input[type="date"]').value;

    if (!name || !date || tutor === "Choose a tutor...") {

        alert("Please complete booking form.");

        return;
    }

    let bookings =
        JSON.parse(localStorage.getItem(BOOKINGS_KEY))
        || [];

    bookings.push({
        name,
        tutor,
        date
    });

    localStorage.setItem(
        BOOKINGS_KEY,
        JSON.stringify(bookings)
    );

    alert("Booking submitted successfully!");

    bookingForm.reset();
});

}
/* =========================
   THEME TOGGLE
========================= */

const themeToggle =
    document.getElementById('themeToggle');

if (themeToggle) {

    const savedTheme =
        localStorage.getItem("theme");

    if (savedTheme === "light") {

        document.body.classList.add("light-mode");

        themeToggle.innerHTML =
            '<i class="fa-solid fa-sun"></i>';
    }

    themeToggle.addEventListener('click', () => {

        document.body.classList.toggle('light-mode');

        if (
            document.body.classList.contains('light-mode')
        ) {

            localStorage.setItem("theme", "light");

            themeToggle.innerHTML =
                '<i class="fa-solid fa-sun"></i>';

        } else {

            localStorage.setItem("theme", "dark");

            themeToggle.innerHTML =
                '<i class="fa-solid fa-moon"></i>';
        }
    });
}
/* =========================
   TUTOR MODALS
========================= */

function openTutorProfile(tutor) {

    const modal =
        document.getElementById(tutor + 'Modal');

    if (modal) {

        modal.classList.add('active');

        document.body.style.overflow = 'hidden';
    }
}

function closeTutorProfile(tutor) {

    const modal =
        document.getElementById(tutor + 'Modal');

    if (modal) {

        modal.classList.remove('active');

        document.body.style.overflow = 'auto';
    }
}

/* =========================
   CLOSE PROFILE MODALS
========================= */

document.querySelectorAll('.profile-modal')
.forEach(modal => {

    modal.addEventListener('click', (e) => {

        if (e.target === modal) {

            const tutor =
                modal.id.replace('Modal', '');

            closeTutorProfile(tutor);
        }
    });
});

</script>
</body>
</html>
